name: Release

# Publishes a GitHub Release when `develop` is merged into `main`.
#
# Flow:
#   1. Bump __version__ in sign_pdfs_beid.py on develop (single source of
#      truth), merge develop -> main.
#   2. This workflow reads the version; if the tag v{version} does not exist
#      yet, it builds both executables on Windows AND Linux (same recipe as
#      ci/build.yml), packages them, tags v{version} and publishes a Release
#      with auto-generated notes and the binaries attached.
#   3. If the tag already exists (merge without a version bump), the run
#      exits early with a notice — nothing is republished.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create tags + releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read __version__ and check the tag
        id: v
        run: |
          VERSION=$(python3 -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('sign_pdfs_beid.py').read_text(encoding='utf-8')).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::Tag v${VERSION} already exists - skipping release. Bump __version__ in sign_pdfs_beid.py on develop to publish."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Will release v${VERSION}."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: true # a broken build on either OS must block the release
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A stalled Tk suite or build must not hold the runner (and, for a
    # release, its concurrency group) for GitHub's 6-hour default.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # xvfb/xauth + Tcl/Tk: the virtual display and the Tk runtime of the GUI
      # suites below.
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils xvfb xauth libtk8.6 libtcl8.6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      # Gate the release on the test suite (Linux only: on the Windows runner
      # Tk could open real windows and hang the job). Same three steps as
      # build.yml: headless suite (the Gui* classes skip themselves), a
      # canary, then the Gui* suites under Xvfb.
      - name: Unit tests (headless)
        if: runner.os == 'Linux'
        run: env -u DISPLAY python -m unittest -v

      # The canary imports gui on purpose: the display guard of the GUI tests
      # swallows an ImportError / NameError / SyntaxError of gui.py exactly
      # like a missing display.
      - name: GUI canary (a broken Tk or a broken gui module must fail, not skip)
        if: runner.os == 'Linux'
        env:
          XMODIFIERS: "@im=none"
        run: xvfb-run -a -s "-screen 0 1920x1200x24" python -c "import tkinter, customtkinter, gui; tkinter.Tk().destroy()"

      # CACHET_REQUIRE_GUI=1 turns the guard's skip into a failure, so "GUI
      # suites green" can never mean "everything skipped".
      - name: GUI suites (Xvfb, skips are failures)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          XMODIFIERS: "@im=none"
          CACHET_REQUIRE_GUI: "1"
          PYTHONFAULTHANDLER: "1"         # with timeout -s ABRT: a stalled suite dumps its stacks
        run: xvfb-run -a -s "-screen 0 1920x1200x24" timeout -s ABRT 900 python -m unittest -v -k Gui

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean cachet.spec

      # Legacy single image, then --text and --signatures: the last two prove
      # that fonts/ and PIL._imagingft are in the CLI binary.
      - name: Smoke test (CLI visual signatures, no eID hardware)
        shell: bash
        run: |
          python - <<'PY'
          import json
          from test_sign_pdfs_beid import make_pdf, make_png
          make_pdf("smoke.pdf", [(595, 842), (595, 842)])
          make_png("sig.png")
          with open("smoke_sigs.json", "w", encoding="utf-8") as fh:
              json.dump([
                  {"kind": "text", "text": "JD {date}", "font": "caveat", "font_size": 14,
                   "all_pages": True, "x": 500, "y": 20},
                  {"kind": "image", "image_path": "sig.png", "width_pt": 120,
                   "page": 1, "x": 60, "y": 700},
              ], fh)
          print("fixtures written")
          PY
          CLI=$(ls dist/cachet-cli* | head -1)
          "$CLI" --version
          "$CLI" --mode image --image-path sig.png --input smoke.pdf \
                 --output smoke_out --page 1 --x 100 --y 100
          test -n "$(ls smoke_out/*.pdf 2>/dev/null)" || { echo "FAIL: no output PDF"; exit 1; }
          echo "OK: image mode works in the frozen binary."
          "$CLI" --mode image --text "Jane Doe" --font great-vibes --color "#1A3FB4" \
                 --input smoke.pdf --output smoke_text --page 1 --x 100 --y 100
          test -n "$(ls smoke_text/*.pdf 2>/dev/null)" || { echo "FAIL: no text-mode output"; exit 1; }
          "$CLI" --mode image --signatures smoke_sigs.json --input smoke.pdf --output smoke_multi
          test -n "$(ls smoke_multi/*.pdf 2>/dev/null)" || { echo "FAIL: no --signatures output"; exit 1; }
          echo "OK: bundled fonts + text rendering work in the frozen binary."

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          V=${{ needs.version.outputs.version }}
          tar -czf "cachet-${V}-linux-x86_64.tar.gz" -C dist cachet cachet-cli

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          V=${{ needs.version.outputs.version }}
          7z a "cachet-${V}-windows-x86_64.zip" ./dist/cachet.exe ./dist/cachet-cli.exe

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            cachet-*-linux-x86_64.tar.gz
            cachet-*-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Cachet v${{ needs.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: packages/*
          fail_on_unmatched_files: true
          body: |
            Standalone binaries (no Python required):
            - `cachet-…-linux-x86_64.tar.gz` — `cachet` (GUI) + `cachet-cli` (console)
            - `cachet-…-windows-x86_64.zip` — `cachet.exe` (GUI) + `cachet-cli.exe` (console)

            Runtime requirements (beid mode): Belgian eID middleware + reader.
            Levels ≥ b-t need network (TSA / trust lists / OCSP-CRL) — see BUILD.md.

      # Rebuilds cachet.alchemic.studio so the release data baked into its
      # pages matches this version. The site also queries the GitHub API from
      # the browser on every page load, so skipping this only leaves the
      # prerendered copy stale — it never leaves the site wrong.
      #
      # Needs a token that can write to AlchemicStudio/cachet-website; the
      # job's own GITHUB_TOKEN is scoped to this repository. Create a
      # fine-grained PAT with "Contents: read and write" on cachet-website and
      # store it as the WEBSITE_DISPATCH_TOKEN secret. Without it the step
      # reports a notice and the release still succeeds.
      - name: Refresh the website
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::notice::WEBSITE_DISPATCH_TOKEN is not set - skipping the website refresh."
            exit 0
          fi
          gh api repos/AlchemicStudio/cachet-website/dispatches \
            -f event_type=cachet-release
          echo "::notice::Asked cachet-website to rebuild."
